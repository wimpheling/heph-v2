[workspace]
members = ["crates/core", "crates/proto", "crates/server"]
exclude = ["tools/dylint"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
heph-core = { path = "crates/core" }
heph-proto = { path = "crates/proto" }
axum = "0.8"
buffa = { version = "0.9.2", features = ["json"] }
connectrpc = { version = "0.9", default-features = false, features = ["axum", "json"] }
connectrpc-build = "0.9"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[workspace.metadata.dylint]
libraries = [{ path = "tools/dylint" }]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
