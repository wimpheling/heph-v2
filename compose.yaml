services:
  postgres:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB explicitly}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER explicitly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD explicitly}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?Set POSTGRES_PORT explicitly}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
