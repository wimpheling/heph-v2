name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install pnpm
        run: npm install --global pnpm@12.11.2
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go mod download
      - run: pnpm install --frozen-lockfile
      - name: Check generated bindings
        run: |
          pnpm generate
          git diff --exit-code -- gen packages/contracts/src/gen
          test -z "$(git ls-files --others --exclude-standard -- gen packages/contracts/src/gen)"
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - name: Install Playwright browser
        run: pnpm --filter @heph/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/e2e/playwright-report/
          retention-days: 7
