name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install pnpm
        run: npm install --global pnpm@12.11.2
      - name: Install Rust
        run: rustup show
      - name: Install Dylint toolchain
        run: rustup toolchain install nightly-2026-04-16 --profile minimal --component rustc-dev --component llvm-tools-preview
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - name: Install Dylint
        run: cargo install cargo-dylint dylint-link --version 6.0.0 --locked
      - run: pnpm install --frozen-lockfile
      - name: Check generated bindings
        run: pnpm generate && git diff --exit-code -- packages/contracts/src/gen
      - run: pnpm check
      - run: pnpm test
      - run: pnpm test:rust-lints
      - run: pnpm build
      - name: Install Playwright browser
        run: pnpm --filter @heph/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/e2e/playwright-report/
          retention-days: 7
